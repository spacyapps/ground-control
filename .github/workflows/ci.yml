name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      # No third-party dependencies, so there is nothing to resolve or cache.
      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      - name: Install SwiftLint
        run: brew install swiftlint

      # Walter's rule: the Swift must be lint-clean, so warnings fail the build.
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
