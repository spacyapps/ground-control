name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      # No third-party dependencies, so there is nothing to resolve or cache.
      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      # The pages in Settings are the only reason a stranger trusts a monitor
      # sitting beside their terminal, and every claim on them maps to
      # something checkable. The release scripts gate on this too; running it
      # here catches the drift on the commit that caused it rather than on the
      # day of a release.
      - name: Licence audit
        run: ./Scripts/licence-audit.sh

      - name: Install SwiftLint
        run: brew install swiftlint

      # The rule here: the Swift must be lint-clean, so warnings fail the build.
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
